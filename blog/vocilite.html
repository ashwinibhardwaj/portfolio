  <meta charset="UTF-8">

  <meta name="description" content="Vocilite a Chrome extension that explains text and reads it aloud.">
  <title>Vocilite · Ashwini Bhardwaj</title>

  <link rel="icon" type="image/png" href="../static/assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../static/assets/favicon.svg" />

<body>

<main id="blog-main">
  <div class="container" style="padding-top:80px;color:var(--muted)">Loading…</div>
</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const main = document.getElementById("blog-main");

  main.innerHTML = `
    <div class="container">
      <div class="blog-hero fade">

        <div class="tags" style="margin-bottom:20px">
          <span class="tag">AI</span>
          <span class="tag">Side Project</span>
          <span class="tag">LLM</span>
        </div>

        <h2>Vocilite: Simple Text Explanations with Voice</h2>

        <p style="font-size:1.1rem;color:var(--muted2);margin:16px 0 28px;line-height:1.7">
          I built a Chrome extension that explains complex text in plain English and reads it out loud.
        </p>

        <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
          <span class="reading-time">July 13, 2025 · 5 min read</span>
        </div>

      </div>

      <div class="blog-content fade">

        <p>
          This project started pretty casually.
          I was reading through a technical article packed with dense terminology,
          and I kept interrupting myself just to search for explanations.
        </p>

        <p>
          Every few minutes, I’d switch tabs,
          search a concept,
          read a definition,
          then come back and try to regain context.
        </p>

        <p>
          Eventually I caught myself thinking:
          <em>why isn’t there something that just explains this instantly, right where I’m reading?</em>
        </p>

        <p>
          That idea eventually became <strong>Vocilite</strong>
          a Chrome extension that explains highlighted text in simple language and can even read it aloud.
        </p>

        <h2>The Core Idea</h2>

        <p>
          The goal wasn’t to build another chatbot.
          It was to reduce friction while reading.
        </p>

        <p>
          I wanted users to stay inside their workflow instead of constantly jumping between tabs,
          articles, and search engines.
        </p>

        <p>
          The interaction needed to feel lightweight:
          highlight text,
          click once,
          and immediately understand what you’re reading.
        </p>

        <p>
          Then I added voice support because sometimes listening is easier than reading
          especially while multitasking or going through long explanations.
        </p>

        <h2>Building the Extension</h2>

        <p>
          What looked simple at first quickly turned into a complete pipeline.
        </p>

        <ul>
          <li>Capture highlighted text directly from webpages</li>
          <li>Send the selected text to a backend service</li>
          <li>Generate simplified explanations using an LLM</li>
          <li>Display results instantly inside the extension UI</li>
          <li>Convert responses into speech using browser APIs</li>
        </ul>

        <p>
          The interesting part wasn’t just generating text.
          It was making the entire interaction feel fast and natural.
        </p>

        <h2>Tech Stack</h2>

        <ul>
          <li><strong>Chrome Extension</strong> for the frontend interaction layer</li>
          <li><strong>Flask</strong> backend for request handling</li>
          <li><strong>LangChain</strong> for orchestration and prompt flow</li>
          <li><strong>Groq + LLaMA 3</strong> for low-latency generation</li>
          <li><strong>Web Speech API</strong> for voice playback</li>
        </ul>

        <p>
          One thing I learned quickly:
          responsiveness matters a lot in browser tools.
        </p>

        <p>
          Even small delays make the experience feel disconnected,
          so optimizing latency became more important than adding extra features.
        </p>

        <h2>Challenges I Didn’t Expect</h2>

        <p>
          I originally assumed the difficult part would be the AI model itself.
          Surprisingly, most of the work ended up being around usability and edge cases.
        </p>

        <ul>
          <li>Cleaning noisy webpage text before sending it to the model</li>
          <li>Making explanations concise instead of overly verbose</li>
          <li>Ensuring speech output sounded natural</li>
          <li>Handling inconsistent formatting across websites</li>
          <li>Keeping the extension lightweight and distraction-free</li>
        </ul>

        <blockquote>
          Good AI products feel simple on the surface because complexity is handled underneath.
        </blockquote>

        <h2>What I Learned</h2>

        <p>
          Vocilite taught me that building AI features is only a small part of building useful products.
        </p>

        <p>
          The real challenge is designing interactions people genuinely enjoy using.
        </p>

        <p>
          Small UX details ended up mattering more than model sophistication:
          response speed,
          readability,
          clarity,
          and how naturally the tool fits into existing workflows.
        </p>

        <p>
          This project also pushed me deeper into thinking about practical AI systems
          not just prompts and models,
          but product design,
          latency,
          reliability,
          and user experience.
        </p>

        <h2>Project</h2>

        <p>
          You can explore the full project here:
          <a href="https://github.com/ashwinibhardwaj/TextExplainer_Vocilite" target="_blank">
            Vocilite on GitHub
          </a>
        </p>

        <h2>What’s Next</h2>

        <p>
          I’m continuing to improve the project,
          especially around voice quality,
          multilingual support,
          and smarter context-aware explanations.
        </p>

        <p>
          The long-term idea is simple:
          make understanding information feel effortless.
        </p>

      </div>
    </div>
  `;

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add("visible");
    });
  }, { threshold: 0.08 });

  main.querySelectorAll('.fade').forEach(el => obs.observe(el));
});
</script>

</body>
</html>
