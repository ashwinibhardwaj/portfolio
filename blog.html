  <meta charset="UTF-8">

  <meta name="description" content="Ashwini Bhardwaj - AI Developer building intelligent systems, autonomous agents, and production-ready AI pipelines.">
  <title>Blog · Ashwini Bhardwaj</title>

  <link rel="icon" type="image/svg+xml" href="static/assets/favicon.svg" />

<script src="static/base.js" defer></script>
  <script src="static/script.js" defer></script>
</head>
<body>

<main>
<canvas id="fog"></canvas>
<div class="container">
  <div class="page-hero fade">
    <div class="label">Writing</div>
    <h1>The AI Lab</h1>
    <p>Notes from building with AI - exploring LLMs, agents, and systems through real projects.</p>
  </div>

  <div id="blog-grid" class="blog-grid" style="margin-bottom:80px">
    <div class="empty" style="padding:60px 0;color:var(--muted)">Loading posts…</div>
  </div>
</div>
</main>

<script>
const BLOG_ICONS = [
  // Pen
  `<svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/></svg>`,

  // Notebook
  `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>`,

  // Pencil
  `<svg viewBox="0 0 24 24"><path d="M3 21l3-1 12-12-2-2L4 18l-1 3z"/></svg>`,

  // Document
  `<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>`
];

document.addEventListener("DOMContentLoaded", async () => {
  const grid = document.getElementById("blog-grid");
  try {
    const blogs = await loadJSON("data/blogs.json");
    if (!blogs.length) {
      grid.innerHTML = '<div class="empty">No posts yet - check back soon.</div>';
      return;
    }
    grid.innerHTML = blogs.map((b, i) => `
      <a href="blog/${b.id}.html" class="blog-card fade" style="text-decoration:none">
        <div class="blog-card-img">
          <div class="blog-card-img-bg"></div>
          <span class="blog-icon">
            ${BLOG_ICONS[i % BLOG_ICONS.length]}
          </span>
        </div>
        <div class="blog-card-body">
          <div class="blog-card-meta">
            <span class="blog-card-date">${b.date}</span>
            <div class="tags">
              ${b.tags.slice(0, 2).map(t => `<span class="tag" style="font-size:0.65rem;padding:2px 8px">${t}</span>`).join('')}
            </div>
          </div>
          <h3>${b.title}</h3>
          <p>${b.description}</p>
          <span class="blog-read-more">
            Read Article
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </div>
      </a>
    `).join('');

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
    }, { threshold: 0.08 });
    grid.querySelectorAll('.fade').forEach(el => obs.observe(el));
  } catch (e) {
    grid.innerHTML = '<div class="empty">Could not load posts.</div>';
  }
});
</script>

</body>
</html>
